<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90">
  <defs>
    <linearGradient id="odontoBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2CA1E7" />
      <stop offset="100%" stop-color="#1479BD" />
    </linearGradient>
  </defs>

  <!-- ÍCONE DO DENTE EM AZUL COM ANEL ORBITAL -->
  <g transform="translate(6, 4) scale(0.48)">
    <!-- Arco traseiro da órbita -->
    <path d="M 12 82 C 12 70, 75 50, 125 58" fill="none" stroke="#2CA1E7" stroke-width="8" stroke-linecap="round" opacity="0.6" />
    
    <!-- Corpo do dente -->
    <path d="M 45 42 
             C 30 52, 22 75, 22 95 
             C 22 120, 32 145, 42 165 
             C 47 175, 54 178, 60 166 
             C 67 150, 72 135, 78 126 
             C 81 122, 85 122, 88 126 
             C 94 135, 99 150, 106 166 
             C 112 178, 119 175, 124 165 
             C 134 145, 144 120, 144 95 
             C 144 75, 136 52, 121 42 
             C 107 33, 93 38, 83 45 
             C 73 38, 59 33, 45 42 Z" 
          fill="url(#odontoBlueGrad)" />

    <!-- Fenda sutil de iluminação -->
    <path d="M 83 48 C 76 68, 62 100, 48 116" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

    <!-- Arco dianteiro da órbita -->
    <path d="M 8 108 
             C 18 128, 75 142, 138 108 
             C 162 95, 172 80, 165 74 
             C 158 68, 138 74, 115 84" 
          fill="none" stroke="#1B87CE" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- TIPOGRAFIA: ODONTO super + 5 pontos -->
  <g transform="translate(100, 31)">
    <!-- ODONTO -->
    <text x="0" y="0" font-family="'Outfit', 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="16.5" font-weight="800" letter-spacing="2.8" fill="#1B87CE">ODONTO</text>
    
    <!-- super -->
    <text x="0" y="40" font-family="'Outfit', 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="47" font-weight="800" letter-spacing="-0.8" fill="#1479BD">super</text>
    
    <!-- 5 esferas sob 'per' -->
    <g transform="translate(71, 48)">
      <circle cx="0" cy="0" r="3.2" fill="#1B87CE" />
      <circle cx="11" cy="0" r="3.2" fill="#1B87CE" />
      <circle cx="22" cy="0" r="3.2" fill="#1B87CE" />
      <circle cx="33" cy="0" r="3.2" fill="#1B87CE" />
      <circle cx="44" cy="0" r="3.2" fill="#1B87CE" />
    </g>
  </g>
</svg>
